# sred-canada — innovation-criteria profile (Layer 1 — company)
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ CAPTURE LENS, NOT ELIGIBILITY ARGUMENT. CRA's standard-practice test is      │
# │ field-level; "new to us" is ineligible. This layer calibrates what the       │
# │ company records and investigates. See capability schema/eligibility-         │
# │ baseline.yaml (Layer 0, not editable) for the invariant test.               │
# └──────────────────────────────────────────────────────────────────────────────┘
# THIS FILE SHIPS BLANK. It is the template for the claimant's own Layer 1, not a
# company's filled-in lens. Do not edit it in place: the plugin overwrites it on every
# update, and every project on the install would share whatever you wrote.
#
# Where the company's values live (resolution order — first one found wins):
#   1. sred/company-criteria.yaml in the project's substrate. sred-onboarding Chapter 4
#      copies this template there and fills company, fields_of_science and
#      technology_baseline from the claimant interview.
#   2. A forked pack (sred-canada → sred-<co>) whose copy of this profile is filled in —
#      for an org that runs many projects under one claimant and wants the lens shared.
#   3. This file. Still holding "<...>" placeholders means NO company lens is declared:
#      the tracker and reviewer work from Layer 0 and the project's Layer 2 alone, and
#      say so, rather than critiquing against an empty baseline.
profile_id: "sred-canada.innovation-criteria"
layer: 1

company: "<legal name of the claimant — the entity filing the T661>"

fields_of_science:
  # CRA field-of-science codes this company claims under. 2.02.09 (software engineering)
  # covers most software work; take the claimant's own codes, never assume.
  - code: "<e.g. 2.02.09>"
    label: "<e.g. Software engineering>"

technology_baseline:
  # Established practice FOR THIS COMPANY'S DOMAINS — work built entirely on these
  # is presumed routine unless a project's Layer 2 declares a specific frontier.
  # Write each as a practice the field already knows, e.g. "Standard REST API
  # integration per vendor docs" — not as something the company finds easy.
  - "<established practice in the company's domain>"

exemplars:
  # Positive/negative examples from past claims — the reviewer critiques new TUs
  # against these. Empty until the first claim cycle completes.
  accepted: []
  withdrawn_or_rejected: []

house_language:
  # Company additions to the pack's risky_language_patterns (funder-reporting profile)
  additional_risky_patterns:
    - "we integrated"
    - "we adopted"
    - "our team had never"      # company-relative framing — reframe field-relative
    - "we didn't have a way to"  # company-relative framing — reframe field-relative

advisor_guidance: |
  [House guidance from the engaged SR&ED advisor — filled when engaged. E.g. preferred
   narrative depth, cost-allocation conventions, documentation thresholds.]

project_layer:
  # Where each project's Layer 2 lives and how it's authored.
  file: "sred/criteria.yaml"
  authored_by: "project-sred-tracker define_criteria (guided interview; advisor recommended)"
  refresh: "nudged by the quarterly log review; changes logged as sred.criteria.updated"
